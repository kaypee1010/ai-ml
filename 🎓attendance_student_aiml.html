<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI & ML Attendance — BTech Sem 7</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Georgia',serif;background:linear-gradient(135deg,#f5f1e8,#e8e3d8);min-height:100vh;padding:16px}
.card{max-width:460px;margin:0 auto;background:#fff;border-radius:10px;box-shadow:0 4px 20px rgba(0,0,0,.12);overflow:hidden}
.header{background:linear-gradient(135deg,#8B3A3A,#6B2D2D);color:#fff;padding:20px 24px;display:flex;gap:14px;align-items:center}
.logo{width:54px;height:54px;border-radius:50%;border:2px solid rgba(255,255,255,.3);overflow:hidden;flex-shrink:0}
.logo img{width:100%;height:100%;object-fit:cover}
.hinfo h1{font-size:18px;margin-bottom:2px}
.hinfo p{font-size:12px;opacity:.9}
.hinfo a{color:#ffd89b;font-size:12px;text-decoration:none;border:1px solid rgba(255,216,155,.4);padding:2px 7px;border-radius:3px;display:inline-block;margin-top:5px}
.body{padding:24px}
.gps-banner{background:#fff8e1;border:2px solid #f9a825;border-radius:8px;padding:14px 16px;margin-bottom:18px;display:flex;gap:12px;align-items:flex-start}
.gps-banner .icon{font-size:24px;flex-shrink:0;margin-top:2px}
.gps-banner h3{font-size:14px;color:#e65100;margin-bottom:3px}
.gps-banner p{font-size:12px;color:#555;line-height:1.5}
.btn-gps{margin-top:8px;background:#f9a825;color:#fff;border:none;padding:7px 14px;border-radius:4px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
.btn-gps:disabled{background:#ccc;cursor:not-allowed}
.gps-result{padding:10px 14px;border-radius:6px;font-size:13px;margin-bottom:16px;display:none}
.gps-ok{background:#d4edda;color:#155724;border:1px solid #c3e6cb}
.gps-warn{background:#fff3cd;color:#856404;border:1px solid #ffeeba}
.field{margin-bottom:16px}
label{display:block;font-weight:600;font-size:13px;color:#444;margin-bottom:5px}
select,input[type=text]{width:100%;padding:11px 13px;border:1px solid #d0c8b8;border-radius:5px;font-size:15px;background:#fafafa;font-family:inherit;transition:border-color .2s}
select:focus,input:focus{outline:none;border-color:#8B3A3A;box-shadow:0 0 0 3px rgba(139,58,58,.1);background:#fff}
.name-box{background:#f0ebe0;border:1px solid #c8b89a;border-radius:5px;padding:11px 13px;font-size:15px;font-weight:600;color:#5a3a1a;min-height:44px;display:flex;align-items:center}
.name-ok{color:#1a5c2a !important}
.name-err{color:#7c1c24 !important}
.btn-submit{width:100%;padding:14px;background:#8B3A3A;color:#fff;border:none;border-radius:5px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;transition:background .2s;margin-top:4px}
.btn-submit:hover{background:#6B2D2D}
.btn-submit:disabled{background:#aaa;cursor:not-allowed}
.msg{padding:14px;border-radius:6px;margin-bottom:16px;font-size:14px;display:none;text-align:center;line-height:1.5}
.msg.success{background:#d4edda;color:#155724;border:1px solid #c3e6cb}
.msg.error{background:#f8d7da;color:#721c24;border:1px solid #f5c6cb}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.footer{text-align:center;font-size:11px;color:#aaa;margin-top:18px;padding-top:14px;border-top:1px solid #eee}
.otp-input{letter-spacing:6px;font-size:22px;text-align:center;font-family:'Courier New',monospace}
</style>

// ══════════ STATE ══════════
var resolvedName = '', gpsLat = null, gpsLng = null, gpsAccuracy = null;
var gpsStatus = 'pending', gpsRequested = false, submitting = false;

// ══════════ HELPERS ══════════
function $(id){ return document.getElementById(id); }

function todayStr() {
  var d = new Date();
  return d.getFullYear() + '-' +
         String(d.getMonth() + 1).padStart(2, '0') + '-' +
         String(d.getDate()).padStart(2, '0');
}

function timeStr() {
  return new Date().toLocaleTimeString('en-IN', {hour:'2-digit', minute:'2-digit'});
}

// fetch with timeout — never hangs forever
function fetchWithTimeout(url, opts) {
  var controller = new AbortController();
  var timer = setTimeout(function(){ controller.abort(); }, FETCH_TIMEOUT_MS);
  opts = opts || {};
  opts.signal = controller.signal;
  return fetch(url, opts).finally(function(){ clearTimeout(timer); });
}

function showMsg(text, type) {
  var el = $('msg');
  el.textContent = text;
  el.className = 'msg ' + type;
  el.style.display = 'block';
  el.scrollIntoView({behavior:'smooth', block:'nearest'});
  if (type === 'success') setTimeout(function(){ el.style.display = 'none'; }, 8000);
}

function showGPSResult(type, text) {
  var el = $('gpsResult');
  el.textContent = text;
  el.className = 'gps-result ' + (type === 'ok' ? 'gps-ok' : 'gps-warn');
  el.style.display = 'block';
}

function haversine(la1, lo1, la2, lo2) {
  var R = 6371000, dL = (la2-la1)*Math.PI/180, dO = (lo2-lo1)*Math.PI/180;
  var a = Math.sin(dL/2)*Math.sin(dL/2) +
          Math.cos(la1*Math.PI/180)*Math.cos(la2*Math.PI/180)*Math.sin(dO/2)*Math.sin(dO/2);
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

// ══════════ GPS ══════════
function handleGPSSuccess(pos) {
  gpsLat = pos.coords.latitude;
  gpsLng = pos.coords.longitude;
  gpsAccuracy = Math.round(pos.coords.accuracy);
  var dist = haversine(gpsLat, gpsLng, SGT_LAT, SGT_LNG);
  gpsStatus = dist <= RADIUS_M ? 'on-campus' : 'off-campus';
  gpsRequested = true;
  $('gpsBanner').style.display = 'none';
  if (gpsStatus === 'on-campus') {
    showGPSResult('ok', 'Location verified — on SGT campus (\u00B1' + gpsAccuracy + 'm)');
  } else {
    showGPSResult('warn', 'You appear ' + Math.round(dist) + 'm from campus — submission will be flagged for review.');
  }
}

function handleGPSError() {
  gpsStatus = 'denied';
  gpsRequested = true;
  $('gpsBanner').style.display = 'none';
  showGPSResult('warn', 'Location unavailable — submission will be marked GPS-unverified.');
}

function requestGPS() {
  var btn = $('gpsBtn');
  btn.textContent = 'Requesting...';
  btn.disabled = true;
  if (!navigator.geolocation) { handleGPSError(); return; }
  navigator.geolocation.getCurrentPosition(handleGPSSuccess, handleGPSError,
    {enableHighAccuracy: true, timeout: 12000, maximumAge: 0});
}

// Silent attempt on load — if permission already granted, banner disappears
window.addEventListener('load', function() {
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(handleGPSSuccess, function(){/* keep banner */},
      {enableHighAccuracy: false, timeout: 6000, maximumAge: 60000});
  }
});

// ══════════ ROSTER LOOKUP ══════════
$('reg').addEventListener('input', checkStudent);
$('section').addEventListener('change', checkStudent);

function checkStudent() {
  var sec = $('section').value;
  var reg = $('reg').value.trim();
  var box = $('nameBox');
  box.textContent = '\u2014';
  box.className = 'name-box';
  resolvedName = '';
  if (!sec || reg.length < 9) return;
  var list = ROSTER[sec] || [];
  var found = null;
  for (var i = 0; i < list.length; i++) {
    if (list[i].reg === reg) { found = list[i]; break; }
  }
  if (found) {
    box.textContent = found.name;
    box.className = 'name-box name-ok';
    resolvedName = found.name;
  } else {
    box.textContent = 'Not found in Section ' + sec + ' roster';
    box.className = 'name-box name-err';
  }
}

// ══════════ SUBMIT ══════════
function setSubmitting(on) {
  submitting = on;
  var btn = $('submitBtn');
  btn.disabled = on;
  btn.innerHTML = on ? '<span class="spinner"></span>Submitting...' : 'Mark My Attendance';
}

function submitAttendance() {
  if (submitting) return;  // hard double-click guard

  var sec = $('section').value;
  var reg = $('reg').value.trim();
  var otp = $('otp').value.trim();

  if (!gpsRequested)      { showMsg('Enable location first — tap "Enable Location Now" above.', 'error'); return; }
  if (!sec)               { showMsg('Please select your section.', 'error'); return; }
  if (!reg)               { showMsg('Please enter your registration number.', 'error'); return; }
  if (!resolvedName)      { showMsg('Registration number not found in Section ' + sec + '. Check both fields.', 'error'); return; }
  if (!/^[0-9]{6}$/.test(otp)) { showMsg('Enter the 6-digit OTP shown on the projector.', 'error'); return; }

  setSubmitting(true);

  var payload = {
    type: 'attendance',
    subject: 'AI_ML',
    section: sec,
    reg: reg,
    name: resolvedName,
    otp: otp,
    date: todayStr(),
    time: timeStr(),
    gpsStatus: gpsStatus,
    gpsLat: gpsLat !== null ? gpsLat : 'N/A',
    gpsLng: gpsLng !== null ? gpsLng : 'N/A',
    gpsAccuracy: gpsAccuracy !== null ? gpsAccuracy : 'N/A'
  };

  fetchWithTimeout(GAS_URL, {
    method: 'POST',
    redirect: 'follow',
    headers: {'Content-Type': 'text/plain'},
    body: JSON.stringify(payload)
  })
  .then(function(response) {
    if (!response.ok) throw new Error('HTTP ' + response.status);
    return response.json();
  })
  .then(function(result) {
    if (result && result.success) {
      showMsg('Attendance marked! ' + resolvedName + ' \u00B7 Section ' + sec, 'success');
      $('reg').value = '';
      $('otp').value = '';
      $('nameBox').textContent = '\u2014';
      $('nameBox').className = 'name-box';
      resolvedName = '';
    } else {
      showMsg((result && result.error) || 'Submission failed — try again.', 'error');
    }
  })
  .catch(function(err) {
    if (err.name === 'AbortError') {
      showMsg('Request timed out — your attendance may still be recorded. Wait 10 seconds, then try once more. If it says "already marked", you are done.', 'error');
    } else {
      showMsg('Network problem — check internet and try again.', 'error');
    }
  })
  .finally(function() {
    setSubmitting(false);
  });
}

// Enter key submits from OTP field
$('otp').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') submitAttendance();
});
</script>
</body>
</html>
